# Irreversibility layer.
#
# This file exists for exactly one reason: some damage cannot be undone after a
# commit lands. A secret written into git history stays in the history even
# after CI rejects the push — removing it means rewriting history. So it has to
# be stopped at commit time, by something that binds any committer.
#
# That is the only jurisdiction this layer holds, and the whole design rests on
# keeping it that way:
#
#   Claude Code hooks  bind the agent, before the action runs  -> formatting, dangerous commands
#   pre-commit         binds any committer, at commit time     -> irreversible harm only
#   make quality       binds the change, before it is done     -> the full gate
#   CI                 binds the remote, before merge          -> the full gate again
#
# Linting and formatting are deliberately NOT here. Ruff already runs on every
# file Claude edits (PostToolUse hook), on the whole project in `make quality`,
# and again in CI. A fourth copy would only make committing slow enough that
# people start reaching for --no-verify, which costs more than it protects.
#
# Install with: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        name: block committed private keys
      - id: check-added-large-files
        name: block accidentally committed large files
      - id: check-merge-conflict
        name: block unresolved merge conflict markers

  - repo: local
    hooks:
      - id: no-real-env-file
        name: block committing a real .env file
        entry: >-
          A real .env file must never be committed. Put the variable names in
          .env.example instead, with placeholder values.
        language: fail
        files: ^\.env$
