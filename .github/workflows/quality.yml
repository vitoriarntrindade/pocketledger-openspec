name: Quality

# The remote half of the definition of done.
#
# A merge must never depend on an agent's own claim that the work is correct.
# These are the same gates `make quality` runs locally, re-run by something
# with no stake in the answer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type checking
        run: mypy app

      - name: Security scan
        run: bandit -c pyproject.toml -q -r app

      # The same script the local gate calls, so the two cannot drift.
      - name: Secret scan
        run: scripts/scan-secrets.sh

      # pre-commit is the irreversibility layer, and it only binds a
      # developer who ran `pre-commit install`. Running it here binds the
      # remote too, so a private key committed by someone who skipped the
      # install is still caught before a merge.
      - name: Commit-time protections
        run: pre-commit run --all-files

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pocketledger
          POSTGRES_PASSWORD: pocketledger
          POSTGRES_DB: pocketledger_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pocketledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The 95% floor comes from [tool.coverage.report] fail_under, so it is
      # enforced identically here and locally. OTEL export is disabled because
      # no collector is listening; leaving it on adds minutes of retry backoff.
      - name: Tests with coverage floor
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pocketledger:pocketledger@localhost:5433/pocketledger_test
          DATABASE_URL: postgresql+psycopg://pocketledger:pocketledger@localhost:5433/pocketledger_test
          OTEL_ENABLED: "false"
          ENVIRONMENT: test
          JWT_SECRET: ci-only-secret-not-used-outside-ci
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  specs:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.8.0

      - name: Validate specs and changes
        run: openspec validate --all --strict
