# Example pyproject.toml configuration for Python best practices

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-project"
version = "0.1.0"
description = "Your project description"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.0.275",
    "mypy>=1.4",
    "flake8>=6.0",
    "black>=23.0",
    "pre-commit>=3.0",
]

# Ruff Configuration
[tool.ruff]
line-length = 78
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "BLE",    # flake8-blind-except
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "PERF",   # perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "RUF",    # ruff-specific
]

ignore = [
    "E501",   # line too long (handled by line-length)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
known-third-party = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["F401", "F811"]

# MyPy Configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
strict_equality = true
disallow_untyped_defs = false  # Set to true for strict mode

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "setuptools.*",
    "distutils.*",
]
ignore_missing_imports = true

# PyDocStyle Configuration
[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D104"]  # Ignore missing module/package docstring
match = "(?!test_).*\\.py"

# Coverage Configuration
[tool.coverage.run]
source = ["src", "app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
